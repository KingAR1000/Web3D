<style>
:root {
  --bg0: #141415; --bg1: #1b1b1c; --bg2: #232324; --bg3: #2a2a2b; --bg4: #313133; --bg5: #3a3a3c; --bg6: #454547; --bg7: #545456;
  --line: #0f0f10; --line2: #343436; --line3: #48484b;
  --txt: #e4e4e6; --txt2: #a9a9ad; --txt3: #75757a;
  --accent: #4d7fe0; --accent2: #3b67bf; --accent-soft: rgba(77,127,224,.18); --accent-glow: rgba(77,127,224,.45);
  --sel: #ff8a1f; --act: #ffbf5e;
  --ax-x: #ff3d5a; --ax-y: #84d11a; --ax-z: #3a8eff;
  --ok: #4caf7a; --warn: #e0a33a; --err: #e0524d;
  --r: 5px; --r2: 8px;
  --font: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --right-w: 340px; --outliner-h: 34%;
  --ease: cubic-bezier(.2,.8,.2,1);
  --shadow: 0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--txt); font: 12px/1.35 var(--font); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--bg6); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--bg7); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ic.sm { width: 13px; height: 13px; }
.ic.lg { width: 20px; height: 20px; }
.ic.fill { fill: currentColor; stroke: none; }

/* ---------- App layout ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: 34px 1fr 24px; }
#topbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; z-index: 20; }
#main { display: grid; grid-template-columns: 1fr 5px var(--right-w); min-height: 0; position: relative; }
#statusbar { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--bg1); border-top: 1px solid var(--line); color: var(--txt2); font-size: 11px; white-space: nowrap; overflow: hidden; }

.logo { display: flex; align-items: center; gap: 7px; padding: 0 8px 0 2px; font-weight: 650; letter-spacing: .2px; color: var(--txt); }
.logo svg { width: 20px; height: 20px; filter: drop-shadow(0 0 6px rgba(255,138,31,.35)); }
.logo span b { color: var(--sel); font-weight: 700; }
.menubar { display: flex; align-items: center; gap: 1px; }
.mbtn { height: 24px; padding: 0 9px; border: 0; border-radius: var(--r); background: transparent; color: var(--txt); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .12s; }
.mbtn:hover, .mbtn.open { background: var(--bg5); }
.mbtn.icon-only { padding: 0 5px; }
.ws-tabs { display: flex; align-items: center; gap: 2px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line2); }
.ws-tab { height: 24px; padding: 0 12px; border: 0; border-radius: var(--r); background: transparent; color: var(--txt2); transition: all .15s; }
.ws-tab:hover { color: var(--txt); background: var(--bg4); }
.ws-tab.active { color: var(--txt); background: var(--bg5); box-shadow: inset 0 -2px 0 var(--accent); }
.spacer { flex: 1; min-width: 4px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--line2); font-size: 11px; color: var(--txt2); white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.badge.webgl i { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
#panelToggle { display: none; }

/* ---------- Viewport ---------- */
#vpArea { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg2); }
.editor-header { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px; background: var(--bg3); border-bottom: 1px solid var(--line); flex: none; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.editor-header::-webkit-scrollbar { display: none; }
.hsep { width: 1px; height: 18px; background: var(--line2); margin: 0 4px; flex: none; }
.seg { display: inline-flex; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 1px; flex: none; }
.seg button { height: 22px; min-width: 26px; padding: 0 6px; border: 0; background: transparent; color: var(--txt2); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: all .12s; }
.seg button:hover { color: var(--txt); background: var(--bg5); }
.seg button.on { background: var(--accent); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 2px 8px var(--accent-glow); }
.drop { height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg4); color: var(--txt); display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; transition: background .12s; }
.drop:hover { background: var(--bg6); }
.drop .chev { opacity: .6; width: 10px; height: 10px; }
.tbtn { height: 24px; min-width: 26px; padding: 0 5px; border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--txt2); display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: none; transition: all .12s; }
.tbtn:hover { background: var(--bg5); color: var(--txt); }
.tbtn.on { background: var(--accent-soft); border-color: rgba(77,127,224,.55); color: #cfe0ff; }

#viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; outline: none; }
#viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { pointer-events: none; }
#vpInfo { position: absolute; left: 62px; top: 10px; pointer-events: none; color: var(--txt); text-shadow: 0 1px 2px rgba(0,0,0,.8); font-size: 12px; line-height: 1.5; }
#vpInfo .dim { color: var(--txt2); }
#vpInfo .stats { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: #d7d7d7; }
#modalHeader { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 14px; border-radius: 20px; background: rgba(20,20,22,.88); border: 1px solid var(--line3); font-family: var(--mono); font-size: 12px; color: #fff; pointer-events: none; display: none; box-shadow: var(--shadow); backdrop-filter: blur(6px); white-space: nowrap; }
#modalHeader b { color: var(--act); font-weight: 600; }
#boxSel { position: absolute; border: 1px dashed rgba(255,255,255,.9); background: rgba(255,255,255,.06); pointer-events: none; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
#boxSel.sub { border-color: #ff7b7b; background: rgba(255,80,80,.06); }

/* toolbar */
#toolbar { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 2px; padding: 3px; background: rgba(36,36,38,.92); border: 1px solid var(--line); border-radius: var(--r2); box-shadow: 0 4px 16px rgba(0,0,0,.35); backdrop-filter: blur(6px); z-index: 3; transition: opacity .2s, transform .25s var(--ease); }
#toolbar.hidden { opacity: 0; transform: translateX(-120%); pointer-events: none; }
#toolbar .sep { height: 1px; background: var(--line2); margin: 3px 4px; }
.tool { width: 36px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--txt2); display: grid; place-items: center; position: relative; transition: background .12s, color .12s; }
.tool:hover { background: var(--bg5); color: var(--txt); }
.tool.on { background: var(--accent); color: #fff; box-shadow: 0 2px 10px var(--accent-glow); }
.tool .ic { width: 20px; height: 20px; }

/* nav gizmo */
#navGizmo { position: absolute; right: 10px; top: 10px; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 3; transition: right .25s var(--ease); }
#navGizmo canvas { position: relative; width: 100px; height: 100px; border-radius: 50%; cursor: grab; transition: background .15s; }
#navGizmo canvas:hover { background: rgba(255,255,255,.07); }
#navGizmo canvas:active { cursor: grabbing; }
.navbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(40,40,42,.75); color: var(--txt2); display: grid; place-items: center; transition: all .12s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.navbtn:hover { background: var(--bg6); color: #fff; }
.navbtn.on { background: var(--accent); color: #fff; }
#vpArea.sidebar-open #navGizmo { right: 270px; }

/* N sidebar */
#sidebar { position: absolute; top: 0; right: 0; bottom: 0; width: 260px; background: rgba(38,38,40,.96); border-left: 1px solid var(--line); display: flex; z-index: 4; transform: translateX(100%); transition: transform .25s var(--ease); backdrop-filter: blur(8px); }
#vpArea.sidebar-open #sidebar { transform: none; box-shadow: -8px 0 24px rgba(0,0,0,.3); }
#sidebar .sb-body { flex: 1; overflow-y: auto; padding: 6px; min-width: 0; }
#sidebar .sb-tabs { width: 24px; display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line); }
.vtab { writing-mode: vertical-rl; padding: 10px 0; border: 0; background: transparent; color: var(--txt3); font-size: 11px; letter-spacing: .4px; border-left: 2px solid transparent; }
.vtab:hover { color: var(--txt); }
.vtab.on { color: var(--txt); background: var(--bg4); border-left-color: var(--accent); }
#sbToggle { position: absolute; right: 6px; top: 50%; width: 14px; height: 44px; margin-top: -22px; border: 0; border-radius: 4px; background: rgba(60,60,62,.6); color: var(--txt2); display: grid; place-items: center; z-index: 3; opacity: .6; transition: opacity .15s, right .25s var(--ease); }
#sbToggle:hover { opacity: 1; }
#vpArea.sidebar-open #sbToggle { right: 266px; }

/* adjust last op */
#lastOp { position: absolute; left: 10px; bottom: 10px; width: 250px; background: rgba(38,38,40,.96); border: 1px solid var(--line); border-radius: var(--r2); box-shadow: var(--shadow); z-index: 4; display: none; animation: pop .18s var(--ease); }
#lastOp .lo-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; font-weight: 600; }
#lastOp .lo-body { padding: 2px 8px 8px; }
#lastOp.collapsed .lo-body { display: none; }
#lastOp.collapsed .lo-head .ic { transform: rotate(-90deg); }

/* ---------- Splitters ---------- */
.splitter { background: var(--line); position: relative; z-index: 5; transition: background .15s; }
.splitter:hover, .splitter.drag { background: var(--accent); }
.splitter.v { cursor: col-resize; }
.splitter.h { cursor: row-resize; height: 5px; flex: none; }

/* ---------- Right side ---------- */
#right { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg2); }
#outliner { height: var(--outliner-h); min-height: 80px; display: flex; flex-direction: column; flex: none; }
#properties { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ed-title { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; background: var(--bg3); border-bottom: 1px solid var(--line); flex: none; color: var(--txt2); }
.ed-title .ttl { color: var(--txt); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.search { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--bg1); border: 1px solid var(--line); flex: 1; min-width: 40px; color: var(--txt3); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--txt); font-size: 11.5px; }
.search:focus-within { border-color: var(--accent); }

#tree { flex: 1; overflow: auto; padding: 4px 0; background: var(--bg2); }
#tree.drop-root { box-shadow: inset 0 0 0 1px var(--accent); }
.row { display: flex; align-items: center; height: 22px; padding-right: 6px; gap: 4px; color: var(--txt); cursor: default; position: relative; }
.row:nth-child(even) { background: rgba(255,255,255,.018); }
.row:hover { background: rgba(255,255,255,.06); }
.row.sel { background: rgba(77,127,224,.26); }
.row.act { background: rgba(77,127,224,.42); }
.row.act .nm { color: #fff; }
.row.hidden-obj .nm, .row.hidden-obj .tico { opacity: .45; }
.row.drop-target { box-shadow: inset 0 0 0 1px var(--sel); background: rgba(255,138,31,.12); }
.row .tw { width: 14px; height: 14px; display: grid; place-items: center; color: var(--txt3); border-radius: 3px; flex: none; }
.row .tw:hover { color: var(--txt); background: var(--bg5); }
.row .tw.leaf { visibility: hidden; }
.row .tw .ic { width: 10px; height: 10px; transition: transform .15s; }
.row .tw.closed .ic { transform: rotate(-90deg); }
.row .tico { width: 15px; height: 15px; }
.row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm input { width: 100%; height: 18px; border: 1px solid var(--accent); background: var(--bg1); border-radius: 3px; padding: 0 4px; outline: 0; }
.row .rb { width: 20px; height: 18px; border: 0; background: transparent; color: var(--txt2); display: grid; place-items: center; border-radius: 3px; opacity: .85; }
.row .rb:hover { background: var(--bg5); color: #fff; opacity: 1; }
.row .rb.off { opacity: .35; }
.k-mesh { color: #f0a35e; } .k-light { color: #f5d76e; } .k-camera { color: #8fb7ff; } .k-empty { color: #c9c9c9; } .k-scene { color: #e9e9e9; } .k-text { color: #f0a35e; }
.row.scene-row { color: var(--txt2); font-weight: 600; }
.empty-hint { padding: 16px; color: var(--txt3); text-align: center; }

/* properties */
#propWrap { flex: 1; display: flex; min-height: 0; }
#propTabs { width: 32px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: var(--bg1); border-right: 1px solid var(--line); overflow-y: auto; }
.ptab { width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--txt2); display: grid; place-items: center; transition: all .12s; position: relative; }
.ptab:hover { background: var(--bg4); color: var(--txt); }
.ptab.on { background: var(--bg4); color: var(--txt); box-shadow: inset 2px 0 0 var(--accent); }
.ptab .ic { width: 17px; height: 17px; }
.ptab.t-render { color: #9fc1ff; } .ptab.t-world { color: #ff8a8a; } .ptab.t-object { color: #ffad5c; } .ptab.t-data { color: #7fdc9a; } .ptab.t-material { color: #ff8acb; } .ptab.t-scene { color: #c7a0ff; }
#propBody { flex: 1; overflow-y: auto; padding: 6px 6px 40px; min-width: 0; }
.prop-head { display: flex; align-items: center; gap: 7px; padding: 4px 6px 8px; font-weight: 600; }
.prop-head .ic { color: var(--sel); }
.prop-head input { flex: 1; min-width: 0; height: 22px; border: 1px solid var(--line); background: var(--bg1); border-radius: var(--r); padding: 0 7px; outline: 0; }
.prop-head input:focus { border-color: var(--accent); }

.panel { background: var(--bg3); border: 1px solid var(--line); border-radius: var(--r2); margin-bottom: 6px; overflow: hidden; }
.panel > .ph { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; cursor: pointer; font-weight: 600; color: var(--txt); background: linear-gradient(var(--bg4), var(--bg3)); }
.panel > .ph:hover { background: var(--bg4); }
.panel > .ph .ic.chev { width: 10px; height: 10px; color: var(--txt2); transition: transform .18s var(--ease); }
.panel.closed > .ph .ic.chev { transform: rotate(-90deg); }
.panel > .pb { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.panel.closed > .pb { display: none; }
.panel .panel { margin: 2px 0 0; background: var(--bg2); }

.field { display: grid; grid-template-columns: 38% 1fr; align-items: center; gap: 8px; min-height: 22px; }
.field > label { text-align: right; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.field.full { grid-template-columns: 1fr; }
.vec { display: flex; flex-direction: column; gap: 1px; }
.vec .num { border-radius: 0; }
.vec .num:first-child { border-radius: var(--r) var(--r) 0 0; }
.vec .num:last-child { border-radius: 0 0 var(--r) var(--r); }
.num { position: relative; height: 22px; background: var(--bg5); border-radius: var(--r); display: flex; align-items: center; overflow: hidden; cursor: ew-resize; transition: background .1s; border: 1px solid transparent; }
.num:hover { background: var(--bg6); }
.num.drag { background: var(--bg7); }
.num .fillbar { position: absolute; inset: 0 auto 0 0; background: var(--accent2); opacity: .85; pointer-events: none; }
.num .nl { position: relative; padding-left: 8px; color: var(--txt2); flex: none; pointer-events: none; }
.num .nv { position: relative; flex: 1; text-align: right; padding-right: 8px; pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.num.slider .nv { text-align: center; padding: 0 8px; }
.num.slider .nl + .nv { text-align: right; }
.num .arr { position: relative; width: 14px; height: 100%; display: grid; place-items: center; color: var(--txt2); opacity: 0; transition: opacity .1s; cursor: pointer; flex: none; }
.num:hover .arr { opacity: 1; }
.num .arr:hover { color: #fff; background: rgba(255,255,255,.08); }
.num input { position: absolute; inset: 0; width: 100%; border: 0; outline: 0; background: var(--bg1); border: 1px solid var(--accent); border-radius: var(--r); padding: 0 8px; text-align: left; cursor: text; }
.num.ax-x .nl { color: #ff8a9a; } .num.ax-y .nl { color: #b5e66c; } .num.ax-z .nl { color: #8cbcff; }
.num.disabled { opacity: .5; pointer-events: none; }
.txt { height: 22px; border: 1px solid var(--line); background: var(--bg1); border-radius: var(--r); padding: 0 7px; outline: 0; width: 100%; }
.txt:focus { border-color: var(--accent); }
textarea.txt { height: 54px; padding: 4px 7px; resize: vertical; }
select.sel { height: 22px; width: 100%; border: 1px solid var(--line); background: var(--bg5); border-radius: var(--r); padding: 0 6px; outline: 0; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--txt2) 50%), linear-gradient(135deg, var(--txt2) 50%, transparent 50%); background-position: calc(100% - 12px) 9px, calc(100% - 8px) 9px; background-size: 4px 4px; background-repeat: no-repeat; cursor: pointer; }
select.sel:hover { background-color: var(--bg6); }
select.sel option { background: var(--bg3); }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; height: 22px; color: var(--txt); }
.chk input { display: none; }
.chk .box { width: 14px; height: 14px; border-radius: 3px; background: var(--bg5); border: 1px solid var(--line); display: grid; place-items: center; transition: all .12s; flex: none; }
.chk .box svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 2.4; fill: none; opacity: 0; transform: scale(.5); transition: all .12s; }
.chk input:checked + .box { background: var(--accent); border-color: var(--accent); }
.chk input:checked + .box svg { opacity: 1; transform: none; }
.chk:hover .box { border-color: var(--line3); }
.color { height: 22px; border-radius: var(--r); position: relative; overflow: hidden; border: 1px solid var(--line); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.color input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); opacity: 0; cursor: pointer; }
.btn { height: 24px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg5); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all .12s; white-space: nowrap; }
.btn:hover { background: var(--bg7); }
.btn.primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
.btn.primary:hover { background: #5b8cec; }
.btn-row { display: flex; gap: 4px; }
.btn-row .btn { flex: 1; }
.btn-row.joined { gap: 1px; }
.btn-row.joined .btn { border-radius: 0; }
.btn-row.joined .btn:first-child { border-radius: var(--r) 0 0 var(--r); }
.btn-row.joined .btn:last-child { border-radius: 0 var(--r) var(--r) 0; }
.btn.on { background: var(--accent); color: #fff; }
.info { color: var(--txt3); font-size: 11px; padding: 2px 2px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 11.5px; padding: 2px 4px; }
.kv span:nth-child(odd) { color: var(--txt2); } .kv span:nth-child(even) { font-family: var(--mono); text-align: right; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--txt2); font-size: 10px; transition: all .12s; }
.swatch:hover { background: var(--bg5); color: var(--txt); border-color: var(--line3); }
.swatch i { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.mat-preview { height: 92px; display: grid; place-items: center; background: radial-gradient(circle at 50% 120%, #3c3c3f, #1d1d1f 70%); border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--line); }
.mat-preview i { width: 70px; height: 70px; border-radius: 50%; transition: background .2s; }

/* ---------- Menus ---------- */
.menu { position: fixed; min-width: 200px; max-width: 320px; padding: 4px; background: rgba(32,32,34,.98); border: 1px solid var(--line3); border-radius: var(--r2); box-shadow: var(--shadow); z-index: 1000; animation: pop .14s var(--ease); backdrop-filter: blur(10px); max-height: calc(100vh - 20px); overflow-y: auto; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.menu .mtitle { padding: 5px 10px 6px; color: var(--txt2); font-weight: 600; font-size: 11px; border-bottom: 1px solid var(--line2); margin-bottom: 4px; }
.mi { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 4px; color: var(--txt); cursor: default; white-space: nowrap; }
.mi .ic { color: var(--txt2); }
.mi .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mi .sc { color: var(--txt3); font-size: 11px; margin-left: 18px; }
.mi .sub { color: var(--txt3); width: 10px; height: 10px; }
.mi:hover, .mi.hl { background: var(--accent); color: #fff; }
.mi:hover .ic, .mi.hl .ic, .mi:hover .sc, .mi.hl .sc, .mi:hover .sub, .mi.hl .sub { color: #fff; }
.mi.disabled { opacity: .4; pointer-events: none; }
.mi .chkm { width: 14px; text-align: center; color: var(--accent); font-weight: 700; }
.mi:hover .chkm { color: #fff; }
.msep { height: 1px; background: var(--line2); margin: 4px 6px; }
.mi u { text-decoration: underline; text-underline-offset: 2px; }

/* command search */
#search { position: fixed; left: 50%; top: 14%; width: min(520px, 92vw); transform: translateX(-50%); background: rgba(30,30,32,.98); border: 1px solid var(--line3); border-radius: 10px; box-shadow: var(--shadow); z-index: 1100; display: none; overflow: hidden; animation: pop .15s var(--ease); }
#search .sh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line2); color: var(--txt2); }
#search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--txt); }
#search .sl { max-height: 50vh; overflow-y: auto; padding: 4px; }
#search .mi { height: 28px; }
#search .mi .cat { color: var(--txt3); font-size: 11px; }
#search .mi.hl .cat { color: #dbe6ff; }

/* dialogs */
.dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1200; display: grid; place-items: center; animation: fade .15s; backdrop-filter: blur(2px); }
@keyframes fade { from { opacity: 0; } }
.dlg { background: var(--bg3); border: 1px solid var(--line3); border-radius: 10px; box-shadow: var(--shadow); max-width: 94vw; max-height: 90vh; display: flex; flex-direction: column; animation: pop .18s var(--ease); overflow: hidden; }
.dlg .dh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; background: var(--bg4); }
.dlg .db { padding: 14px; overflow: auto; }
.dlg .df { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg2); }
.dlg .x { margin-left: auto; border: 0; background: transparent; color: var(--txt2); width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; }
.dlg .x:hover { background: var(--bg6); color: #fff; }
.render-img { max-width: 100%; max-height: 70vh; display: block; border-radius: 4px; background: repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0 / 20px 20px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 4px 24px; width: min(860px, 88vw); }
.keys h4 { grid-column: 1 / -1; margin: 10px 0 2px; color: var(--sel); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
.keys div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); color: var(--txt2); }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--bg6); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--txt); white-space: nowrap; }

/* tooltip & toast */
#tip { position: fixed; z-index: 2000; pointer-events: none; padding: 6px 9px; background: rgba(22,22,24,.97); border: 1px solid var(--line3); border-radius: 6px; box-shadow: var(--shadow); max-width: 280px; opacity: 0; transition: opacity .12s; font-size: 11.5px; }
#tip.show { opacity: 1; }
#tip b { display: block; color: var(--txt); font-weight: 600; }
#tip span { color: var(--txt2); }
#tip kbd { margin-left: 6px; }
#toasts { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1500; pointer-events: none; }
.toast { padding: 7px 14px; border-radius: 20px; background: rgba(30,30,32,.96); border: 1px solid var(--line3); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; animation: toastIn .25s var(--ease); }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .3s; }
.toast i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.toast.ok i { background: var(--ok); } .toast.warn i { background: var(--warn); } .toast.err i { background: var(--err); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }

/* status bar */
.hint { display: inline-flex; align-items: center; gap: 5px; }
.hint svg { width: 13px; height: 15px; }
#statusRight { margin-left: auto; display: flex; gap: 12px; align-items: center; }
#statusRight .st b { color: var(--txt); font-weight: 500; }
.pill { padding: 1px 7px; border-radius: 9px; background: var(--bg4); color: var(--txt2); }

/* loader */
#loading { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #232326, #111112 70%); transition: opacity .5s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .lc { display: flex; flex-direction: column; align-items: center; gap: 16px; }
#loading .cube { width: 64px; height: 64px; animation: spin 2.4s var(--ease) infinite; filter: drop-shadow(0 0 18px rgba(255,138,31,.45)); }
@keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(.9); } 100% { transform: rotate(360deg) scale(1); } }
#loading .bar { width: 180px; height: 3px; border-radius: 3px; background: var(--bg4); overflow: hidden; }
#loading .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--sel), transparent); animation: slide 1.1s infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
#loading .msg { color: var(--txt2); font-size: 12px; }
#loading .err { color: #ff9b97; max-width: 420px; text-align: center; line-height: 1.6; }

/* drag & drop */
#dropZone { position: fixed; inset: 0; z-index: 2500; display: none; place-items: center; background: rgba(20,30,50,.6); border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; pointer-events: none; }
body.dragging-file #dropZone { display: grid; }

/* maximize viewport */
#app.max #main { grid-template-columns: 1fr 0 0; }
#app.max #right, #app.max .splitter.v { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) { .ws-tabs { display: none; } }
@media (max-width: 900px) {
  :root { --right-w: 300px; }
  #main { grid-template-columns: 1fr; }
  .splitter.v { display: none; }
  #right { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--right-w), 88vw); z-index: 30; box-shadow: -10px 0 30px rgba(0,0,0,.5); transform: translateX(105%); transition: transform .28s var(--ease); border-left: 1px solid var(--line); }
  body.panels-open #right { transform: none; }
  #panelToggle { display: inline-flex; }
  .hint.opt { display: none; }
  .logo span { display: none; }
  #vpInfo { font-size: 11px; }
}
@media (max-width: 620px) {
  #topbar .menubar .mbtn { padding: 0 6px; }
  .badge .bt { display: none; }
  .hide-sm { display: none !important; }
  #navGizmo { transform: scale(.82); transform-origin: top right; }
  #statusbar .hint { display: none; }
  #toolbar .tool { width: 32px; height: 30px; }
  #sidebar { width: 230px; }
  #vpArea.sidebar-open #navGizmo { right: 240px; }
  #vpArea.sidebar-open #sbToggle { right: 236px; }
}
@media (pointer: coarse) { .num .arr { opacity: 1; } }
</style>

<script type="module">
import * as THREE from 'three/webgpu';
import { pass, uniform, renderOutput, vec4 } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { outline } from 'three/addons/tsl/display/OutlineNode.js';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Blender convention: Z is up.
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const SVGNS = 'http://www.w3.org/2000/svg';
const DEG = Math.PI / 180;
const clamp = THREE.MathUtils.clamp;
function ic(name, cls = '') {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'ic ' + cls);
  const u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
function fmt(v, p = 3) {
  if (!isFinite(v)) return '0';
  let s = (+v).toFixed(p);
  if (s.includes('.')) s = s.replace(/\.?0+$/, '');
  return s === '-0' ? '0' : s;
}
function parseExpr(str) {
  const s = String(str).trim().replace(/,/g, '.').replace(/°|m$/g, '');
  if (!/^[\d\s+\-*/().eE]*$/.test(s) || !s) return NaN;
  try { return Number(Function('"use strict";return (' + s + ')')()); } catch { return NaN; }
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function toast(msg, type = '') {
  const t = h('div', { class: 'toast ' + type }, h('i'), msg);
  $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2600);
}
function fatal(msg) {
  $('#loading .lc').innerHTML = '';
  $('#loading .lc').append(h('div', { class: 'err', html: msg }));
}

/* =====================================================================
   Renderer (WebGPU first, automatic WebGL2 fallback)
   ===================================================================== */
const prefs = Object.assign({ backend: 'auto' }, store.get('web3d.prefs', {}));
const viewport = $('#viewport');
const overlay = $('#overlay');
const octx = overlay.getContext('2d');
let renderer;
try {
  const forceWebGL = new URLSearchParams(location.search).has('webgl') || prefs.backend === 'webgl';
  renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL, powerPreference: 'high-performance' });
  await renderer.init();
} catch (err) {
  console.error(err);
  fatal('Unable to initialize WebGPU or WebGL 2.<br>Please use a modern browser with hardware acceleration enabled.<br><small>' + (err?.message || err) + '</small>');
  throw err;
}
const BACKEND = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL 2';
const canvas = renderer.domElement;
canvas.id = 'gl';
canvas.tabIndex = -1;
viewport.prepend(canvas);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

/* =====================================================================
   Settings
   ===================================================================== */
const S = {
  mode: 'object', tool: 'select', shading: 'solid', xray: false, overlays: true,
  ov: { grid: true, axes: true, origins: true, cursor: true, outline: true, stats: false, wireframe: false },
  solid: { color: 'material', single: '#bdbdbd', bg: '#393939' },
  world: { lighting: 'sky', color: '#3a3d44', strength: 0.8, showBg: true, blur: 0.35, bg: '#2c2e33',
           skyTop: '#3f6fb8', skyHorizon: '#c9d8e8', skyGround: '#4b4540', fog: false, fogColor: '#a9b6c4', fogDensity: 0.02 },
  render: { shadows: true, shadowRes: 2048, tone: 'agx', exposure: 0, msaa: true, scale: 1, width: 1920, height: 1080,
            bloom: false, bloomStrength: 0.6, bloomRadius: 0.4, bloomThreshold: 0.85, outlineWidth: 1 },
  orientation: 'global', pivot: 'median', snap: false, snapInc: 1, rotInc: 15,
};
const TONE = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping, neutral: THREE.NeutralToneMapping, reinhard: THREE.ReinhardToneMapping, none: THREE.NoToneMapping };
const COL = { sel: 0xff8a1f, act: 0xffbf5e, idle: 0x0b0b0b };

/* =====================================================================
   Scene, cameras, controls
   ===================================================================== */
const scene = new THREE.Scene();
scene.environmentRotation.set(Math.PI / 2, 0, 0);
scene.backgroundRotation.set(Math.PI / 2, 0, 0);
const helpers = new THREE.Group(); helpers.name = '__helpers';
const rig = new THREE.Group(); rig.name = '__rig';
scene.add(helpers, rig);

const perspCam = new THREE.PerspectiveCamera(40, 1, 0.05, 4000);
perspCam.position.set(9.6, -8.9, 6.9);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 10000);
const camViewCam = new THREE.PerspectiveCamera(40, 1, 0.05, 4000);
let viewCam = perspCam;
const view = { ortho: false, orthoH: 10, camView: null, axisName: null, autoOrtho: false, frame: null };
let vpW = 1, vpH = 1, vpRect = canvas.getBoundingClientRect();

// Alt+LMB emulates the middle mouse button (orbit / Shift = pan)
canvas.addEventListener('pointerdown', e => {
  controls.mouseButtons.LEFT = (e.button === 0 && e.altKey) ? THREE.MOUSE.ROTATE : null;
}, { capture: true });

const controls = new OrbitControls(perspCam, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.22, screenSpacePanning: true, zoomToCursor: true,
  rotateSpeed: 0.9, zoomSpeed: 1.15, panSpeed: 1, minDistance: 0.02, maxDistance: 4000 });
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: null };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.target.set(0, 0, 0.4);
controls.update();
controls.addEventListener('start', () => {
  viewAnim = null;
  if (view.camView) exitCameraView();
  if (controls.state === 0 && view.axisName) {
    view.axisName = null;
    if (view.autoOrtho) { view.autoOrtho = false; setOrtho(false); }
  }
  dirty.info = true;
});
controls.addEventListener('change', () => requestRender());

const tc = new TransformControls(perspCam, canvas);
tc.setSize(0.95);
const tcHelper = tc.getHelper();
helpers.add(tcHelper);
const pivotProxy = new THREE.Object3D();
helpers.add(pivotProxy);

/* =====================================================================
   Render pipeline: scene pass + bloom + selection outline (TSL)
   ===================================================================== */
const outlineSel = [];
const U = {
  thickness: uniform(1.0), glow: uniform(0.0), strength: uniform(3.0),
  vis: uniform(new THREE.Vector3(1.0, 0.54, 0.12)), hid: uniform(new THREE.Vector3(0.25, 0.12, 0.02)),
  bloomStrength: uniform(0.6), bloomRadius: uniform(0.4), bloomThreshold: uniform(0.85),
};
let pipeline = null, outlinePass = null, pipeKey = '';
function currentTone() { return (S.shading === 'material' || S.shading === 'rendered') ? TONE[S.render.tone] : THREE.NoToneMapping; }
function buildPipeline(force = false) {
  const tone = currentTone();
  const useBloom = S.render.bloom && (S.shading === 'rendered' || S.shading === 'material');
  const key = [viewCam.uuid, tone, S.render.msaa, useBloom].join('|');
  if (!force && key === pipeKey && pipeline) return;
  pipeKey = key;
  if (pipeline) { outlinePass.dispose(); pipeline.dispose(); }
  pipeline = new THREE.RenderPipeline(renderer);
  pipeline.outputColorTransform = false;
  const scenePass = pass(scene, viewCam, { samples: S.render.msaa ? 4 : 0 });
  let color = scenePass;
  if (useBloom) color = color.add(bloom(scenePass, U.bloomStrength, U.bloomRadius, U.bloomThreshold));
  outlinePass = outline(scene, viewCam, { selectedObjects: outlineSel, edgeThickness: U.thickness, edgeGlow: U.glow });
  const edge = outlinePass.visibleEdge.mul(U.vis).add(outlinePass.hiddenEdge.mul(U.hid)).mul(U.strength);
  const out = renderOutput(color, tone, THREE.SRGBColorSpace);
  pipeline.outputNode = vec4(out.rgb.add(edge), 1);
  updateSelectionVisuals();
}

/* =====================================================================
   Floor grid (baked fading lines) & lighting rigs
   ===================================================================== */
let grid = null, gridBg = '';
function buildGrid(bgHex) {
  if (grid && gridBg === bgHex) return;
  gridBg = bgHex;
  if (grid) { grid.geometry.dispose(); grid.removeFromParent(); }
  const N = 50, bg = new THREE.Color(bgHex);
  const minor = new THREE.Color(0x545454), major = new THREE.Color(0x6b6b6b);
  const ax = new THREE.Color(0xd8455b), ay = new THREE.Color(0x86c22b);
  const pos = [], col = [], c = new THREE.Color();
  const pt = (x, y, base) => {
    const f = Math.pow(clamp(1 - Math.hypot(x, y) / N, 0, 1), 1.6);
    c.copy(bg).lerp(base, f);
    pos.push(x, y, 0); col.push(c.r, c.g, c.b);
  };
  for (let i = -N; i <= N; i++) {
    const base = i % 10 === 0 ? major : minor;
    for (let j = -N; j < N; j++) {
      pt(j, i, i === 0 ? ax : base); pt(j + 1, i, i === 0 ? ax : base);
      pt(i, j, i === 0 ? ay : base); pt(i, j + 1, i === 0 ? ay : base);
    }
  }

  renderer.setPixelRatio(pr); renderer.setSize(size.x, size.y, false);
  helpers.visible = true;

}

/* =====================================================================
   Scenes
   ===================================================================== */
function newDefaultScene() {
  clearScene();
  cursor3d.set(0, 0, 0);
  const cube = newMesh('cube');
  scene.add(cube);
  const light = newLight('point', { name: 'Light' });
  light.position.set(4.08, 1.0, 5.9);
  scene.add(light);
  const cam = newCamera();
  cam.position.set(7.36, -6.93, 4.96);
  cam.rotation.set(63.56 * DEG, 0, 46.69 * DEG);
  scene.add(cam);
  sceneCameraObj = cam;
  perspCam.position.set(9.6, -8.9, 6.9); controls.target.set(0, 0, 0.4);
  if (view.ortho) setOrtho(false);
  controls.update();
  applyShading();
  setSel([cube], cube);
  resetHistory('Original');
}
async function loadDemo() {
  await loadFont().catch(() => {});
  clearScene();
  const put = (o, p, r) => { if (p) o.position.set(...p); if (r) o.rotation.set(...r.map(v => v * DEG)); scene.add(o); return o; };
  const P = n => ({ ...PRESET_RESET, ...MAT_PRESETS.find(m => m.name === n) });
  put(newMesh('plane', { size: 40 }, { name: 'Ground', mat: { color: '#7c8088', roughness: 0.92 } }));
  put(newMesh('torusknot', { radius: 0.85, tube: 0.28 }, { name: 'Gold Knot', mat: P('Gold') }), [0, 0.4, 1.55]);
  put(newMesh('uvsphere', { radius: 0.9, segments: 64, rings: 32 }, { name: 'Glass Orb', mat: P('Glass') }), [-2.9, 1.2, 0.9]);
  put(newMesh('uvsphere', { radius: 0.75, segments: 64, rings: 32 }, { name: 'Chrome Ball', mat: P('Chrome') }), [2.9, 1.8, 0.75]);
  put(newMesh('cube', { size: 1.2 }, { name: 'Plastic Box', mat: P('Plastic') }), [2.4, -2.2, 0.6], [0, 0, 24]);
  put(newMesh('torus', { majorRadius: 0.95, minorRadius: 0.11, majorSegments: 96, minorSegments: 16 }, { name: 'Neon Ring', mat: P('Neon') }), [-2.4, -2.3, 0.11]);
  put(newMesh('cylinder', { radius: 0.45, depth: 1.8 }, { name: 'Ceramic Vase', smooth: true, mat: P('Ceramic') }), [-0.4, 3.4, 0.9]);
  put(newMesh('capsule', { radius: 0.45, length: 0.9 }, { name: 'Velvet Capsule', mat: P('Velvet') }), [4.6, -0.6, 0.9]);
  put(newMesh('icosphere', { radius: 0.6, subdivisions: 1 }, { name: 'Copper Gem', mat: P('Copper') }), [0.4, -3.4, 0.6]);
  if (FONT) put(newMesh('text', { text: 'Web3D', size: 0.9, depth: 0.25, bevel: 0.03 }, { name: 'Title', mat: P('Car Paint') }), [-2.2, 5.6, 0], [90, 0, 0]);
  const sun = newLight('sun', { name: 'Sun' }); sun.userData.light.intensity = 3.2; put(sun, [3, -4, 8], [38, 12, 28]);
  const warm = newLight('point', { name: 'Warm Fill' }); warm.userData.light.color.set('#ffb36b'); warm.userData.light.intensity = 45; buildLightProxy(warm); put(warm, [-3.5, -3.8, 2.6]);
  const cam = newCamera({ name: 'Camera' });
  const look = new THREE.PerspectiveCamera(); look.position.set(9.2, -11.5, 6.4); look.lookAt(0, 0.4, 1);
  cam.position.copy(look.position); cam.quaternion.copy(look.quaternion); cam.rotation.reorder('ZYX');
  scene.add(cam); sceneCameraObj = cam;
  Object.assign(S.world, { lighting: 'sky', strength: 0.9, showBg: true, blur: 0.3 });
  Object.assign(S.render, { bloom: true }); U.bloomStrength.value = S.render.bloomStrength;
  perspCam.position.set(10.5, -12.5, 7.2); controls.target.set(0, 0.3, 1);
  if (view.ortho) setOrtho(false);
  controls.update();
  setSel([], null);
  setShading('rendered');
  $$('.ws-tab').forEach(b => b.classList.toggle('active', b.dataset.ws === 'rendering'));
  resetHistory('Load Demo Scene');
  toast('Demo scene loaded — orbit with MMB or Alt + LMB', 'ok');
}

/* =====================================================================
   Layout: splitters & resize
   ===================================================================== */
function splitter(el, onMove) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag');
    const mv = ev => onMove(ev);
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
splitter($('#splitV'), e => document.documentElement.style.setProperty('--right-w', clamp(innerWidth - e.clientX, 240, innerWidth * 0.6) + 'px'));
splitter($('#splitH'), e => { const r = $('#right').getBoundingClientRect(); document.documentElement.style.setProperty('--outliner-h', clamp(e.clientY - r.top, 80, r.height - 160) + 'px'); });
function resize() {
  const r = viewport.getBoundingClientRect();
  vpRect = r; vpW = Math.max(1, r.width); vpH = Math.max(1, r.height);
  renderer.setPixelRatio(clamp(Math.min(devicePixelRatio, 2) * S.render.scale, 0.25, 4));
  renderer.setSize(vpW, vpH, false);
  overlay.width = Math.round(vpW * devicePixelRatio); overlay.height = Math.round(vpH * devicePixelRatio);
  perspCam.aspect = vpW / vpH; perspCam.updateProjectionMatrix();
  updateOrthoFrustum();
  if (view.camView) syncCamView();
  requestRender();
}
new ResizeObserver(resize).observe(viewport);
window.addEventListener('resize', () => { vpRect = viewport.getBoundingClientRect(); });

/* =====================================================================
   Main loop
   ===================================================================== */
function flushUI() {
  if (dirty.outliner) { dirty.outliner = false; renderOutliner(); }
  if (dirty.props) { dirty.props = false; liveFields = liveFields.filter(f => f.el?.isConnected); renderProps(); }
  if (dirty.sidebar) { dirty.sidebar = false; renderSidebar(); }
  if (dirty.fields) { dirty.fields = false; liveFields = liveFields.filter(f => f.el?.isConnected); for (const f of liveFields) f(); }
  if (dirty.stats) { dirty.stats = false; renderStatus(); dirty.info = true; }
  if (dirty.info) { dirty.info = false; renderInfo(); }
  if (dirty.hints) { dirty.hints = false; renderHints(); }
}
const _wq = new THREE.Quaternion();
function loop(now) {
  const anim = updateViewAnim(now);
  const moved = controls.enabled && !view.camView && !viewAnim ? controls.update() : false;
  flushUI();
  if (!needsRender && !moved && !anim) return;
  needsRender = false;
  if (!tc.dragging && !modal) syncGizmo();
  if (view.camView) syncCamView();
  updateStudioRig();
  const cq = viewCam.getWorldQuaternion(new THREE.Quaternion());
  scene.traverse(o => {
    const b = o.userData.billboard;
    if (b) { o.getWorldQuaternion(_wq); b.quaternion.copy(_wq.invert().multiply(cq)); }
  });
  pipeline.render();
  drawOverlay();
  drawNavGizmo();
  frames++;
}
setInterval(() => { fps = frames; frames = 0; const p = $('#fpsPill'); if (p) p.textContent = fps ? fps + ' fps' : 'idle'; }, 1000);

}, 250);
